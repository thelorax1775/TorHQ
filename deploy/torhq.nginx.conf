# Reverse proxy for HTTPS termination in front of TorHQ (LAN use).
# Place in /etc/nginx/sites-available/torhq and symlink into sites-enabled.
server {
    listen 443 ssl http2;
    server_name torhq.lan;

    ssl_certificate     /etc/ssl/torhq/fullchain.pem;
    ssl_certificate_key /etc/ssl/torhq/privkey.pem;

    # TorHQ binds to loopback; nginx is the only public listener.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name torhq.lan;
    return 301 https://$host$request_uri;
}
# When proxied, set TORHQ_TRUST_PROXY=true and TORHQ_COOKIE_SECURE=true.
